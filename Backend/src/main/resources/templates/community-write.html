<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<div layout:fragment="content">
    <div class="card shadow-sm">
        <div class="card-header">
            <h4 class="my-2"><i class="bi bi-pencil-square"></i> 커뮤니티 글 작성</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/community/write}" method="post">
                <div class="mb-3">
                    <label for="title" class="form-label fw-bold">제목</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="제목을 입력하세요" required>
                </div>
                <div class="mb-4">
                    <label for="content" class="form-label fw-bold">내용</label>
                    <textarea class="form-control" id="content" name="content" rows="15" placeholder="다른 사람들과 공유할 내용을 작성해보세요." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">게시하기</button>
            </form>
        </div>
    </div>
</div>
</html>
