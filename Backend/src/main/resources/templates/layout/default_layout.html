<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: '선목젊은이 동계수련회'">페이지 제목</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent body scroll */
        }
        body {
            background-color: #f8f9fa;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .fixed-header {
            flex-shrink: 0; /* 헤더 높이 고정 */
            background-color: #fff;
            border-bottom: 1px solid #dee2e6;
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            position: relative; /* 자식 요소의 위치 기준으로 사용 */
            z-index: 1030; /* 다른 요소 위에 표시 */
        }
        main.container {
            flex-grow: 1; /* 남은 공간을 모두 차지 */
            overflow-y: auto; /* 내용이 많을 경우 세로 스크롤 */
            padding-top: 1rem;
            padding-bottom: 1rem;
        }
        .bottom-nav {
            flex-shrink: 0; /* 네비게이션 높이 고정 */
        }
        .header-title {
            font-size: 1.2rem;
            font-weight: bold;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .back-button {
            font-size: 1.5rem;
            color: #333;
        }
        .bottom-nav .nav-link {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: #6c757d;
            padding: 0.4rem 0;
            transition: color 0.2s ease-in-out; /* 부드러운 전환 효과 */
            border-radius: 0; /* 기본 radius 제거 */
        }
        .bottom-nav .nav-link.active {
            background-color: #fff0e6; /* 활성 탭 배경색 (대표 색상의 연한 버전) */
            color: #F57C00; /* 활성 탭 아이콘/텍스트 색상 */
            font-weight: 600;
        }
        .bottom-nav .nav-link i {
            font-size: 1.5rem;
        }
    </style>
    <!-- 각 페이지별로 추가할 CSS가 있다면 여기에 -->
    <th:block layout:fragment="css"></th:block>
</head>
<body>

<div class="wrapper">
    <!-- Header -->
    <header class="fixed-header">
        <a href="javascript:history.back()" class="back-button" th:if="${!isHomePage}"><i class="bi bi-arrow-left"></i></a>
        <span class="header-title" th:text="${pageTitle} ?: '선목젊은이'">페이지 제목</span>
    </header>

    <!-- Main Content -->
    <main class="container">
        <div layout:fragment="content">
            <!-- 각 페이지의 콘텐츠가 여기에 삽입됩니다. -->
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav navbar navbar-light bg-white border-top shadow-sm">
        <div class="nav nav-pills nav-fill w-100" role="tablist">
            <a class="nav-link" th:classappend="${activeTab == 'home'} ? 'active' : ''" th:href="@{/home}"><i class="bi bi-house-door-fill"></i><span>홈</span></a>
            <a class="nav-link" th:classappend="${activeTab == 'schedule'} ? 'active' : ''" th:href="@{/schedule}"><i class="bi bi-calendar-check-fill"></i><span>일정</span></a>
            <a class="nav-link" th:classappend="${activeTab == 'community'} ? 'active' : ''" th:href="@{/community}"><i class="bi bi-people-fill"></i><span>커뮤니티</span></a>
            <a class="nav-link" th:classappend="${activeTab == 'write'} ? 'active' : ''" th:href="@{/write}"><i class="bi bi-pencil-fill"></i><span>나만의 공책</span></a>
            <a class="nav-link" th:classappend="${activeTab == 'mypage'} ? 'active' : ''" th:href="@{/mypage}"><i class="bi bi-person-fill"></i><span>마이페이지</span></a>
        </div>
    </nav>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 각 페이지별로 추가할 JS가 있다면 여기에 -->
    <th:block layout:fragment="script"></th:block>
</body>
</html>
