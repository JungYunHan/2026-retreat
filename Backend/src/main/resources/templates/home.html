<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<th:block layout:fragment="css">
    <style>
        /* 대표 색상을 따뜻한 주황색 계열로 정의합니다. */
        .text-warm-primary {
            color: #F57C00 !important;
        }
    </style>
</th:block>

<div layout:fragment="content">
    <!-- 이미지 슬라이더 (Bootstrap Carousel) -->
    <div id="carouselExampleAutoplaying" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner" style="border-radius: 0.375rem;">
            <div class="carousel-item active">
                <img src="https://images.unsplash.com/photo-1527529482837-4698179dc6ce?auto=format&fit=crop&w=600&h=250&q=80" class="d-block w-100" alt="배너1">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=600&h=250&q=80" class="d-block w-100" alt="배너2">
            </div>
            <div class="carousel-item">
                <img src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=600&h=250&q=80" class="d-block w-100" alt="배너3">
            </div>
        </div>
    </div>

    <header class="py-4 text-center">
        <h1 class="display-5 fw-bold">2026 선목젊은이 동계수련회</h1>
        <p class="lead text-muted">함께 만들어가는 기쁨의 여정</p>
    </header>

    <div class="alert alert-light border" role="alert" sec:authorize="isAuthenticated()">
        <span th:text="${username}">사용자</span>님, 환영합니다!
    </div>

    <div class="row g-4 mb-4">
        <!-- D-Day -->
        <div class="col-md-6">
            <div class="card h-100 text-center shadow-sm">
                <div class="card-body d-flex flex-column justify-content-center">
                    <h5 class="card-title text-muted">수련회까지</h5>
                    <p class="card-text display-4 fw-bold text-warm-primary">
                        D-<span th:text="${dDay}">15</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- 주요 일정 -->
        <div class="col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-header"><h5 class="card-title my-1">오늘의 주요 일정</h5></div>
                <div class="card-body">
                    <ul class="list-group list-group-flush" th:if="${scheduleItems != null and !scheduleItems.isEmpty()}">
                        <li class="list-group-item" th:each="item : ${scheduleItems}">
                            <span class="fw-bold" th:text="${#temporals.format(item.startTime, 'HH:mm')}">09:00</span>:
                            <a th:href="@{/schedule}" class="text-decoration-none" th:text="${item.title}">개회 예배</a>
                        </li>
                    </ul>
                    <p class="card-text text-muted" th:if="${scheduleItems == null or scheduleItems.isEmpty()}">등록된 일정이 없습니다.</p>
                </div>
                <div class="card-footer bg-white border-0 text-end">
                    <a th:href="@{/schedule}" class="btn btn-sm btn-outline-secondary">전체 일정 보기 &rarr;</a>
                </div>
            </div>
        </div>
    </div>

    <!-- 오늘의 식단 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="card-title my-1"><i class="bi bi-egg-fried me-2"></i>오늘의 메뉴</h5>
        </div>
        <div class="card-body">
            <!--/* 메뉴 정보가 있을 경우 */-->
            <div class="row text-center" th:if="${menu != null}">
                <div class="col-4 border-end">
                    <h6 class="text-muted">아침</h6>
                    <div th:if="${menu.breakfast != null}">
                        <p class="fw-bold mb-1" th:text="${menu.breakfast.mainDish}">메인 메뉴</p>
                        <small class="text-muted" th:text="${menu.breakfast.sideDishes}">서브 메뉴</small>
                    </div>
                    <p th:if="${menu.breakfast == null}">-</p>
                </div>
                <div class="col-4 border-end">
                    <h6 class="text-muted">점심</h6>
                    <div th:if="${menu.lunch != null}">
                        <p class="fw-bold mb-1" th:text="${menu.lunch.mainDish}">메인 메뉴</p>
                        <small class="text-muted" th:text="${menu.lunch.sideDishes}">서브 메뉴</small>
                    </div>
                    <p th:if="${menu.lunch == null}">-</p>
                </div>
                <div class="col-4">
                    <h6 class="text-muted">저녁</h6>
                    <div th:if="${menu.dinner != null}">
                        <p class="fw-bold mb-1" th:text="${menu.dinner.mainDish}">메인 메뉴</p>
                        <small class="text-muted" th:text="${menu.dinner.sideDishes}">서브 메뉴</small>
                    </div>
                    <p th:if="${menu.dinner == null}">-</p>
                </div>
            </div>
            <!--/* 메뉴 정보가 없을 경우 */-->
            <p class="card-text text-muted text-center" th:if="${menu == null}">
                오늘의 메뉴 정보가 없습니다.
            </p>
        </div>
    </div>

    <!-- 안내 및 커뮤니티 -->
    <div class="row g-4">
        <!-- 최신 공지 -->
        <div class="col-md-6">
            <div class="card h-100 shadow-sm">
                <div class="card-header"><h5 class="card-title my-1">최신 공지</h5></div>
                <div class="card-body">
                    <ul class="list-group list-group-flush" th:if="${latestNotices != null and !latestNotices.isEmpty()}">
                        <li class="list-group-item" th:each="notice : ${latestNotices}">
                            <a th:href="@{/post/{id}(id=${notice.id})}" class="text-decoration-none" th:text="${notice.title}">최신 공지 제목</a>
                        </li>
                    </ul>
                    <p class="card-text text-muted" th:if="${latestNotices == null or latestNotices.isEmpty()}">등록된 공지사항이 없습니다.</p>
                </div>
                <div class="card-footer bg-white border-0 text-end">
                    <a th:href="@{/community}" class="btn btn-sm btn-outline-secondary">더보기 &rarr;</a>
                </div>
            </div>
        </div>
        <!-- 기타 안내 -->
        <div class="col-md-6 mb-4">
            <div class="list-group shadow-sm">
                <a th:href="@{/info/transportation}" class="list-group-item list-group-item-action d-flex gap-3 py-3">
                    <i class="bi bi-bus-front-fill fs-3 text-warm-primary"></i>
                    <div class="d-flex gap-2 w-100 justify-content-between">
                        <div>
                            <h6 class="mb-0">차량 안내</h6>
                            <p class="mb-0 opacity-75" th:text="${transportationInfo != null ? transportationInfo : '차량 정보가 곧 업데이트될 예정입니다.'}">교회 앞에서 오전 8시에 출발합니다.</p>
                        </div>
                    </div>
                </a>
                <a th:href="@{/info/rooms}" class="list-group-item list-group-item-action d-flex gap-3 py-3">
                    <i class="bi bi-house-heart-fill fs-3 text-warm-primary"></i>
                    <div class="d-flex gap-2 w-100 justify-content-between">
                        <div>
                            <h6 class="mb-0">숙소 배정</h6>
                            <p class="mb-0 opacity-75">숙소 배정 결과를 확인하세요.</p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</div>
</html>
