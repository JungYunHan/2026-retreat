<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <h2 class="card-title">최초 비밀번호 변경</h2>
                        <p class="text-muted">보안을 위해 초기 비밀번호를 새로운 비밀번호로 변경해주세요.</p>
                    </div>

                    <!-- 에러 메시지 표시 -->
                    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}">
                        비밀번호가 일치하지 않습니다.
                    </div>

                    <form th:action="@{/change-password}" method="post">
                        <div class="mb-3">
                            <label for="newPassword" class="form-label">새 비밀번호</label>
                            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
                        </div>
                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
                        </div>
                        <button class="w-100 btn btn-primary btn-lg mt-3" type="submit">비밀번호 변경</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</html>
