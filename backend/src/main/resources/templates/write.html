<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<th:block layout:fragment="css">
    <style>
        .notebook-form {
            background: #fff;
            padding: 2rem;
            border-radius: 0.5rem;
        }
        .title-input {
            width: 100%;
            padding: 10px 0;
            border: none;
            border-bottom: 2px solid #dee2e6;
            font-size: 1.75rem;
            font-weight: bold;
            box-sizing: border-box;
            background-color: transparent;
            margin-bottom: 1.5rem;
        }
        .title-input:focus {
            outline: none;
            border-bottom-color: #F57C00;
        }
        .content-textarea {
            width: 100%;
            height: 60vh;
            padding: 10px;
            border: 1px solid #f1f1f1;
            font-size: 1rem;
            line-height: 2;
            box-sizing: border-box;
            resize: vertical;
            background-color: #fff;
            /* 공책 줄무늬 효과 */
            background-image: linear-gradient(to bottom, #e9ecef 1px, transparent 1px);
            background-size: 100% 2rem; /* line-height와 동일하게 설정 */
            background-attachment: local;
        }
        .content-textarea:focus {
            outline: none;
            border-color: #F57C00;
            box-shadow: 0 0 0 0.25rem rgba(245, 124, 0, 0.25);
        }
    </style>
</th:block>

<div layout:fragment="content">
    <header class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3">나만의 공책</h1>
        <button type="submit" form="notebook-form" class="btn btn-primary">
            <i class="bi bi-check-lg"></i> 저장
        </button>
    </header>

    <form th:action="@{/write}" method="post" id="notebook-form" class="notebook-form shadow-sm">
        <div class="form-group">
            <input type="text" id="title" name="title" class="title-input" placeholder="오늘의 제목" required>
        </div>
        <div class="form-group">
            <textarea id="content" name="content" class="content-textarea" placeholder="자유롭게 생각을 기록해보세요." required></textarea>
        </div>
    </form>
</div>
</html>
