<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<div layout:fragment="content">
    <div class="card shadow-sm mb-4">
        <div class="card-body text-center p-4">
            <i class="bi bi-person-circle" style="font-size: 5rem; color: #adb5bd;"></i>
            <h4 class="card-title mt-3 mb-0" th:text="${user?.name}">사용자 이름</h4>
            <p class="card-text text-muted" th:text="${user?.teamName} + ' / ' + ${user?.position}">소속팀 / 직책</p>
        </div>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header">
            <h5 class="my-1"><i class="bi bi-person-lines-fill me-2"></i>내 정보</h5>
        </div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <strong>이메일</strong>
                <span th:text="${user?.email}">user@example.com</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <strong>연락처</strong>
                <span th:text="${user?.phoneNumber}">010-1234-5678</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <strong>권한</strong>
                <span class="badge bg-primary rounded-pill" th:text="${user?.role}">USER</span>
            </li>
        </ul>
    </div>

    <div class="list-group shadow-sm">
        <a th:href="@{/change-password}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3">
            <div>
                <i class="bi bi-key me-2"></i>
                <span>비밀번호 변경</span>
            </div>
            <i class="bi bi-chevron-right"></i>
        </a>
        <a href="#" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3"
           onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
            <div>
                <i class="bi bi-box-arrow-right me-2"></i>
                <span>로그아웃</span>
            </div>
            <i class="bi bi-chevron-right"></i>
        </a>
    </div>

    <!-- 로그아웃을 위한 숨겨진 폼 -->
    <form id="logout-form" th:action="@{/logout}" method="post" style="display: none;">
    </form>

</div>

</html>
