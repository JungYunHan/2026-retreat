<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default_layout}">

<div layout:fragment="content">
    <!-- 게시글 상세 내용 -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light">
            <h2 class="my-2" th:text="${post.title}">게시글 제목</h2>
            <div class="text-muted small">
                <span th:text="${post.user.name}">작성자</span> |
                <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">작성일</span>
            </div>
        </div>
        <div class="card-body">
            <!-- white-space: pre-wrap; 은 줄바꿈과 공백을 그대로 표시해줍니다. -->
            <p class="card-text" style="white-space: pre-wrap; min-height: 200px;" th:text="${post.content}">게시글 내용</p>
        </div>
        <div class="card-footer text-end">
            <a th:href="@{/community}" class="btn btn-secondary">목록으로</a>
            <!-- TODO: 본인 글일 경우에만 수정/삭제 버튼 보이도록 처리 -->
            <a href="#" class="btn btn-primary">수정</a>
            <a href="#" class="btn btn-outline-danger">삭제</a>
        </div>
    </div>

    <!-- 댓글 목록 -->
    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="my-1"><i class="bi bi-chat-dots"></i> 댓글 <span th:text="${post.comments.size()}">0</span>개</h5>
        </div>
        <div class="card-body">
            <!-- 댓글 작성 폼 -->
            <form th:action="@{/post/{postId}/comments(postId=${post.id})}" method="post" class="mb-4">
                <div class="input-group">
                    <textarea name="content" class="form-control" rows="2" placeholder="따뜻한 댓글을 남겨주세요." required></textarea>
                    <button class="btn btn-primary" type="submit">등록</button>
                </div>
            </form>

            <!-- 댓글 리스트 -->
            <ul class="list-group list-group-flush">
                <li th:each="comment : ${post.comments}" class="list-group-item px-0">
                    <div class="d-flex w-100 justify-content-between">
                        <span class="fw-bold" th:text="${comment.user.name}">댓글 작성자</span>
                        <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">댓글 작성일</small>
                    </div>
                    <p class="mb-1" th:text="${comment.content}">댓글 내용입니다.</p>
                </li>
                <li th:if="${#lists.isEmpty(post.comments)}" class="list-group-item px-0 text-center text-muted">
                    아직 댓글이 없습니다. 첫 댓글을 남겨보세요!
                </li>
            </ul>
        </div>
    </div>
</div>
</html>
