plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.0' // 안정적인 정식 버전으로 변경
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.smgp'
version = '0.0.1-SNAPSHOT'
description = '2026 선목젊은이 겨울 동계수련회 프로젝트 '

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// JWT (JSON Web Token) 라이브러리
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// 엑셀 파일(.xlsx) 처리를 위한 Apache POI 라이브러리 추가
	implementation 'org.apache.poi:poi-ooxml:5.2.5'

	// CSV 파일 처리를 위한 Apache Commons CSV 라이브러리
	implementation 'org.apache.commons:commons-csv:1.10.0'

	// .env 파일을 읽기 위한 라이브러리 (io.github.cdimascio:java-dotenv 로 변경)
	implementation 'io.github.cdimascio:java-dotenv:5.2.2'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.compilerArgs << "-Xlint:deprecation" // Deprecated API 사용에 대한 상세 경고 출력
}

// 테스트 비활성화
test {
	enabled = false
}

// ===================================================
// Next.js 빌드 통합 스크립트
// ===================================================

def frontendDir = "$projectDir/../frontEnd"
def skipFrontend = project.hasProperty('skipFrontend') || System.getProperty('skipFrontend') == 'true'

sourceSets {
	main {
		resources { srcDirs = ["$projectDir/src/main/resources"] }
	}
}

// processResources가 실행될 때마다 프론트엔드 빌드를 수행하던 의존성을 제거합니다.
// 이렇게 하면 'bootRun'으로 개발 서버를 띄울 때 Next.js 빌드를 기다리지 않습니다.
// processResources { dependsOn "copyFrontendToBuild" }
// 그 대신, 최종 빌드(build) 시에만 프론트엔드 빌드를 수행하도록 build 태스크에 의존성을 추가합니다.
tasks.named("build") { dependsOn "copyFrontendToBuild" }

// processResources가 copyFrontendToBuild 이후에 실행되도록 순서 지정
tasks.named("processResources") { 
	dependsOn "copyFrontendToBuild"
}

// 1. npm install
task installFrontend(type: Exec) {
	onlyIf { !skipFrontend }
	workingDir "$frontendDir"
	inputs.dir "$frontendDir"
	group = BasePlugin.BUILD_GROUP
	if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
		commandLine "npm.cmd", "install"
	} else {
		commandLine "npm", "install"
	}
}

// 2. npm run build
task buildFrontend(type: Exec) {
	onlyIf { !skipFrontend }
	dependsOn "installFrontend"
	workingDir "$frontendDir"
	inputs.dir "$frontendDir"
	group = BasePlugin.BUILD_GROUP
	if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
		commandLine "npm.cmd", "run-script", "build"
	} else {
		commandLine "npm", "run-script", "build"
	}
}

// 3. 빌드 결과물(out 폴더)을 Spring Boot static 폴더로 복사
task copyFrontendToBuild(type: Copy) {
	onlyIf { !skipFrontend }
	dependsOn "buildFrontend"
	from "$frontendDir/out"
	into "$projectDir/src/main/resources/static"
	duplicatesStrategy = DuplicatesStrategy.INCLUDE
	outputs.dir "$projectDir/src/main/resources/static"
}

// bootRun 할 때도 프론트엔드 자동 반영 (skipFrontend 설정 시 건너뜀)
tasks.named('bootRun') { dependsOn 'copyFrontendToBuild' }

// 빌드 로그 안내
gradle.taskGraph.whenReady { graph ->
	if (skipFrontend) {
		println "[INFO] skipFrontend=true 프론트엔드 빌드/복사 생략"
	} else if (graph.hasTask(":bootRun")) {
		println "[INFO] bootRun 실행: Next.js 빌드 및 정적파일 반영 예정"
	} else if (graph.hasTask(":build")) {
		println "[INFO] 전체 build에 Next.js 정적파일 포함"
	}
}
